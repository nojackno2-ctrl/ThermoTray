name: Release

on:
  push:
    tags: ['v*']
  # Releasing without pushing a tag first: the release step creates the tag from the version below.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Inno Setup
        run: choco install innosetup --no-progress --yes

      - name: Build, test, package, and verify ThermoTray
        shell: pwsh
        run: |
          ./scripts/package.ps1

      - name: Verify release identity is unused
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          $releaseProbe = @(gh api "repos/$env:RELEASE_REPOSITORY/releases/tags/$env:ReleaseTag" 2>&1)
          $releaseExit = $LASTEXITCODE
          if ($releaseExit -eq 0) {
            throw "Release $env:ReleaseTag already exists; refusing to replace published assets."
          }
          if (($releaseProbe -join "`n") -notmatch 'HTTP 404') {
            throw "Unable to prove release $env:ReleaseTag is unused: $($releaseProbe -join ' ')"
          }

          if ($env:GITHUB_EVENT_NAME -eq 'workflow_dispatch') {
            git ls-remote --exit-code --tags origin "refs/tags/$env:ReleaseTag" | Out-Null
            $tagExit = $LASTEXITCODE
            if ($tagExit -eq 0) {
              throw "Tag $env:ReleaseTag already exists; refusing to attach this commit's assets to another ref."
            }
            if ($tagExit -ne 2) {
              throw "Unable to prove tag $env:ReleaseTag is unused (git ls-remote exit $tagExit)."
            }
          } elseif ($env:GITHUB_REF_NAME -ne $env:ReleaseTag) {
            throw "Pushed tag '$env:GITHUB_REF_NAME' does not match resolved tag '$env:ReleaseTag'."
          }
          exit 0

      # Creates the tag at this commit when it does not exist yet, which is what makes a manual run a
      # complete release path rather than something that has to be tagged first.
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:ReleaseTag `
            "artifacts/release/ThermoTray-Setup-$env:AppVersion.exe" `
            "artifacts/release/ThermoTray-$env:AppVersion-win-x64-portable.zip" `
            "artifacts/release/SHA256SUMS.txt" `
            --target $env:GITHUB_SHA `
            --title "ThermoTray $env:AppVersion" `
            --generate-notes
