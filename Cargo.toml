[package]
name = "thermotray"
# Single source of truth for the product version. The installer, CI and the sensor sidecar read it from here.
version = "2.0.0"
edition = "2021"
rust-version = "1.85"
description = "Windows notification-area CPU/GPU temperature and utilization monitor"
license = "MIT"
repository = "https://github.com/nojackno2-ctrl/ThermoTray"
publish = false
build = "build.rs"

[lib]
name = "thermotray"
path = "src/lib.rs"

# The binary only calls thermotray::run(); it carries the requireAdministrator manifest, so its own test
# harness could not start unelevated. All unit tests live in the library target.
[[bin]]
name = "ThermoTray"
path = "src/main.rs"
test = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Imaging_D2D",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Accessibility",
    "Win32_UI_Controls",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.61"

[dependencies.windows-numerics]
version = "0.2"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
